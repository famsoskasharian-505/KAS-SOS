<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KAS SOS</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #0b120d;
      color: #ffffff;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      margin: 30px auto;
    }

    .card {
      background: #121c15;
      border: 1px solid #26352a;
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.35);
    }

    h1 {
      margin-top: 0;
      margin-bottom: 6px;
      font-size: 28px;
    }

    h2 {
      margin-top: 0;
      font-size: 21px;
    }

    .subtitle {
      color: #9eaaa1;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-bottom: 7px;
      color: #c8d0ca;
      font-size: 14px;
    }

    input,
    select,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 16px;
      border-radius: 10px;
      border: 1px solid #344438;
      background: #0c140f;
      color: white;
      font-size: 16px;
      outline: none;
    }

    textarea {
      min-height: 90px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #5c9d6c;
    }

    button {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 10px;
      background: #287a3d;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 4px;
    }

    button:hover {
      opacity: 0.9;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .logout {
      background: #633333;
      margin-top: 10px;
    }

    .status {
      margin-top: 18px;
      padding: 12px;
      border-radius: 10px;
      background: #0c140f;
      color: #c8d0ca;
      min-height: 44px;
      line-height: 1.4;
    }

    .hidden {
      display: none;
    }

    .info {
      color: #9eaaa1;
      font-size: 13px;
      line-height: 1.5;
      margin-bottom: 18px;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- =====================================================
         LOGIN ADMIN
         ===================================================== -->

    <div class="card">

      <h1>KAS SOS</h1>

      <div class="subtitle">
        Kas Management — Admin
      </div>

      <label for="email">
        Email Admin
      </label>

      <input
        id="email"
        type="email"
        autocomplete="username"
        placeholder="Masukkan email admin"
      >

      <label for="password">
        Password
      </label>

      <input
        id="password"
        type="password"
        autocomplete="current-password"
        placeholder="Masukkan password"
      >

      <button id="loginBtn">
        LOGIN ADMIN
      </button>

      <div id="loginStatus" class="status">
        Belum login.
      </div>

    </div>


    <!-- =====================================================
         PANEL ADMIN
         ===================================================== -->

    <div id="adminPanel" class="hidden">

      <div class="card">

        <h2>Tambah Member</h2>

        <div class="info">
          Member yang dibuat oleh ADMIN akan otomatis mengikuti
          aturan KAS. Tanggal join WIB menjadi tanggal pertama
          kewajiban KAS.
        </div>


        <label for="memberName">
          Nama Member *
        </label>

        <input
          id="memberName"
          type="text"
          placeholder="Contoh: Ajo_Rmc"
        >


        <label for="whatsapp">
          Nomor WhatsApp
        </label>

        <input
          id="whatsapp"
          type="tel"
          placeholder="Contoh: 628123456789"
        >


        <label for="joinedAt">
          Waktu Join (WIB) *
        </label>

        <input
          id="joinedAt"
          type="datetime-local"
        >


        <label for="memberType">
          Tipe Member
        </label>

        <select id="memberType">

          <option value="NORMAL">
            NORMAL
          </option>

        </select>


        <label for="notes">
          Catatan
        </label>

        <textarea
          id="notes"
          placeholder="Catatan admin (opsional)"
        ></textarea>


        <button id="createMemberBtn">
          BUAT MEMBER
        </button>


        <div id="memberStatus" class="status">
          Belum ada proses.
        </div>

      </div>


      <div class="card">

        <button
          id="logoutBtn"
          class="logout"
        >
          LOGOUT ADMIN
        </button>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      createClient
    } from "https://esm.sh/@supabase/supabase-js@2";


    // ========================================================
    // SUPABASE
    // ========================================================

    const SUPABASE_URL =
      "https://nwfodyefdxdsmdrxzfby.supabase.co";


    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_M6BDC3TNoLQTTW3XSOgvyQ_6Y_0l0BD";


    const supabase =
      createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );


    // ========================================================
    // ELEMENT
    // ========================================================

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const loginBtn =
      document.getElementById("loginBtn");

    const loginStatus =
      document.getElementById("loginStatus");

    const adminPanel =
      document.getElementById("adminPanel");

    const memberName =
      document.getElementById("memberName");

    const whatsapp =
      document.getElementById("whatsapp");

    const joinedAt =
      document.getElementById("joinedAt");

    const memberType =
      document.getElementById("memberType");

    const notes =
      document.getElementById("notes");

    const createMemberBtn =
      document.getElementById("createMemberBtn");

    const memberStatus =
      document.getElementById("memberStatus");

    const logoutBtn =
      document.getElementById("logoutBtn");


    // ========================================================
    // DEFAULT WAKTU JOIN
    // WIB
    // ========================================================

    function setDefaultJoinTime() {

      const now =
        new Date();

      const jakarta =
        new Intl.DateTimeFormat(
          "sv-SE",
          {
            timeZone: "Asia/Jakarta",
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            hourCycle: "h23"
          }
        ).format(now);

      joinedAt.value =
        jakarta.replace(" ", "T");
    }


    setDefaultJoinTime();


    // ========================================================
    // LOGIN ADMIN
    // ========================================================

    loginBtn.addEventListener(
      "click",
      async () => {

        const email =
          emailInput.value.trim();

        const password =
          passwordInput.value;


        if (!email || !password) {

          loginStatus.textContent =
            "Email dan password wajib diisi.";

          return;
        }


        loginBtn.disabled = true;

        loginStatus.textContent =
          "Sedang login...";


        const {
          error
        } =
          await supabase.auth.signInWithPassword({
            email,
            password
          });


        if (error) {

          loginStatus.textContent =
            "❌ Login gagal: "
            + error.message;

          loginBtn.disabled = false;

          return;
        }


        // ====================================================
        // CEK ADMIN
        // ====================================================

        const {
          data: isAdmin,
          error: adminError
        } =
          await supabase.rpc("is_admin");


        if (adminError) {

          loginStatus.textContent =
            "❌ Pemeriksaan ADMIN gagal: "
            + adminError.message;

          await supabase.auth.signOut();

          loginBtn.disabled = false;

          return;
        }


        if (!isAdmin) {

          await supabase.auth.signOut();

          loginStatus.textContent =
            "❌ Akun ini bukan ADMIN.";

          loginBtn.disabled = false;

          return;
        }


        // ====================================================
        // ADMIN BERHASIL
        // ====================================================

        loginStatus.textContent =
          "✅ LOGIN ADMIN BERHASIL";

        adminPanel.classList.remove(
          "hidden"
        );

        loginBtn.disabled = false;

      }
    );


    // ========================================================
    // BUAT MEMBER
    // ========================================================

    createMemberBtn.addEventListener(
      "click",
      async () => {

        const name =
          memberName.value.trim();

        const phone =
          whatsapp.value.trim();

        const joinedValue =
          joinedAt.value;

        const type =
          memberType.value;

        const note =
          notes.value.trim();


        if (!name) {

          memberStatus.textContent =
            "❌ Nama member wajib diisi.";

          return;
        }


        if (!joinedValue) {

          memberStatus.textContent =
            "❌ Waktu join wajib diisi.";

          return;
        }


        createMemberBtn.disabled = true;

        memberStatus.textContent =
          "Membuat member...";


        /*
         * datetime-local tidak memiliki timezone.
         *
         * Kita sengaja menambahkan +07:00
         * karena input admin dianggap WIB.
         */

        const joinedAtISO =
          joinedValue + ":00+07:00";


        const {
          data,
          error
        } =
          await supabase.rpc(
            "create_member",
            {
              p_member_name: name,
              p_whatsapp_number:
                phone || null,
              p_joined_at:
                joinedAtISO,
              p_member_type:
                type,
              p_notes:
                note || null
            }
          );


        if (error) {

          memberStatus.textContent =
            "❌ Gagal membuat member: "
            + error.message;

          createMemberBtn.disabled = false;

          return;
        }


        // ====================================================
        // BERHASIL
        // ====================================================

        memberStatus.textContent =
          "✅ Member berhasil dibuat. ID: "
          + data;


        memberName.value = "";
        whatsapp.value = "";
        notes.value = "";

        setDefaultJoinTime();

        createMemberBtn.disabled = false;

      }
    );


    // ========================================================
    // LOGOUT
    // ========================================================

    logoutBtn.addEventListener(
      "click",
      async () => {

        await supabase.auth.signOut();

        adminPanel.classList.add(
          "hidden"
        );

        loginStatus.textContent =
          "Sudah logout.";

        memberStatus.textContent =
          "Belum ada proses.";

      }
    );


    // ========================================================
    // CEK SESSION SAAT HALAMAN DIBUKA
    // ========================================================

    async function checkExistingSession() {

      const {
        data
      } =
        await supabase.auth.getSession();


      if (!data.session) {
        return;
      }


      const {
        data: isAdmin
      } =
        await supabase.rpc("is_admin");


      if (isAdmin === true) {

        loginStatus.textContent =
          "✅ SESSION ADMIN AKTIF";

        adminPanel.classList.remove(
          "hidden"
        );

      } else {

        await supabase.auth.signOut();

      }

    }


    checkExistingSession();

  </script>

</body>
</html>
