<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#050505">
<title>KAS SOS — Street Of Style</title>

<style>
:root{
  --black:#050505;
  --panel:#0b0b0b;
  --panel2:#111111;
  --line:#292929;

  --green:#b7ff00;
  --green2:#70df00;

  --pink:#ff2aa3;

  --white:#f7f7f7;
  --muted:#a6a6a6;

  --red:#ff626b;
  --yellow:#ffd34d;
  --blue:#65b8ff;
}

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

/* ================================
   ANTI OVERSCROLL / ANDROID
================================ */

html{
  margin:0;
  min-height:100%;
  overscroll-behavior-y:none;
  scroll-behavior:auto;
}

body{
  margin:0;
  min-height:100dvh;

  background:
    radial-gradient(
      circle at 10% 10%,
      #b7ff0010,
      transparent 35%
    ),
    radial-gradient(
      circle at 90% 30%,
      #ff2aa310,
      transparent 35%
    ),
    #050505;

  color:var(--white);

  font:11px Arial,sans-serif;

  overflow-x:hidden;
  overscroll-behavior-y:none;

  -webkit-text-size-adjust:100%;
  -webkit-overflow-scrolling:touch;
}

body:before{
  content:"";
  position:absolute;
  inset:0;
  min-height:100%;
  pointer-events:none;
  z-index:-1;
}

/* ================================
   BASIC
================================ */

button,
input,
select,
textarea{
  font-family:Arial,sans-serif;
}

button{
  border:1px solid var(--green2);
  background:var(--green);
  color:#050505;

  border-radius:7px;
  padding:8px;

  font-size:9px;
  font-weight:800;

  min-height:31px;
  cursor:pointer;
}

button:disabled{
  opacity:.45;
  cursor:not-allowed;
}

button:active{
  transform:translateY(1px);
}

input,
select,
textarea{
  width:100%;

  background:#050505;
  color:var(--white);

  border:1px solid #303030;
  border-radius:7px;

  padding:8px;

  font-size:11px;
  outline:none;
}

input:focus,
select:focus,
textarea:focus{
  border-color:var(--green);
  box-shadow:0 0 0 1px #b7ff0033;
}

textarea{
  min-height:48px;
  resize:vertical;
}

.wrap{
  width:min(680px,100%);
  margin:0 auto;
  padding:7px 7px 20px;
}

.hidden{
  display:none!important;
}

/* ================================
   CARDS
================================ */

.card,
.stat,
.item{
  background:#0a0a0af2;

  border:1px solid var(--line);
  border-radius:10px;

  padding:9px;
  margin:6px 0;

  box-shadow:0 4px 18px #0008;
}

.brand{
  max-width:390px;
  margin:7vh auto;
}

.row,
.title,
.actions{
  display:flex;
  gap:6px;
  align-items:center;
}

.title{
  justify-content:space-between;
}

.actions>*{
  flex:1;
}

.grid{
  display:grid;
  gap:6px;
}

.g2{
  grid-template-columns:1fr 1fr;
}

.g3{
  grid-template-columns:repeat(3,1fr);
}

/* ================================
   TEXT
================================ */

h1{
  font-size:18px;
  margin:0;
}

.sub{
  color:var(--green);
  font-weight:800;
  margin:2px 0 8px;
}

label{
  display:block;
  font-size:9px;
  font-weight:800;
  margin:5px 0 2px;
}

.muted{
  color:var(--muted);
}

.green{
  color:var(--green);
}

.pink{
  color:var(--pink);
}

.red
